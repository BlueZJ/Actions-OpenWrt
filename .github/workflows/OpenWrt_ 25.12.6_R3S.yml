name: Build OpenWrt 25.12.6 R3S (Custom APK Repo)

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt Version (e.g., 25.12.6)'
        default: '25.12.6'
        required: true
      repo_branch:
        description: 'Git Branch or Tag (e.g., v25.12.6, openwrt-25.12)'
        default: 'v25.12.6'
        required: true

env:
  REPO_URL: https://github.com/openwrt/openwrt.git
  CONFIG_FILE: 'r3s_eBTF.config'
  TZ: Asia/Shanghai
  
  # ⚠️ 必须修改：替换为你真实的 GitHub 用户名和仓库名
  PAGES_BASE_URL: 'https://BlueZJ.github.io/Actions-OpenWrt'
  
  # R3S 硬件参数
  TARGET_ARCH: 'aarch64'
  TARGET_SUBTARGET: 'rockchip/armv8'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift
          sudo apt-get -y purge azure-cli google-cloud-sdk mono-devel powershell python3-pyelftools python3-jinja2
          sudo apt-get autoremove --purge -y
          df -h

      - name: Install Build Dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-pyelftools python3-setuptools rsync swig unzip zlib1g-dev \
            file wget dwarves qemu-utils openssl

      - name: Clone OpenWrt Source
        run: |
          git clone $REPO_URL --branch ${{ inputs.repo_branch }} --depth 1 openwrt

      - name: Update & Install Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load Config & Force APK Signing
        run: |
          cd openwrt
          [ -e "$GITHUB_WORKSPACE/$CONFIG_FILE" ] || { echo "Error: $CONFIG_FILE not found in repo root"; exit 1; }
          cp "$GITHUB_WORKSPACE/$CONFIG_FILE" .config
          echo "CONFIG_SIGNED_PACKAGES=y" >> .config
          echo "CONFIG_SIGNATURE_CHECK=y" >> .config
          make defconfig


      - name: 🌟 Pre-generate Keys & Inject Files (核心修复)
        run: |
          cd openwrt
          
          # 1. 预生成 RSA 密钥对 (OpenWrt 检测到 key-build.pem 存在会直接使用，不会重新生成)
          echo "🔑 Generating RSA keys for APK signing..."
          openssl genrsa -out key-build.pem 2048
          openssl rsa -in key-build.pem -pubout -out key-build.pub
          
          # 2. 将公钥注入到固件的 rootfs 覆盖目录 (确保刷机后 /etc/apk/keys/ 有公钥)
          mkdir -p files/etc/apk/keys
          cp key-build.pub files/etc/apk/keys/
          
          # 3. 注入自定义软件源地址
          mkdir -p files/etc/apk/repositories.d
          VER="${{ inputs.openwrt_version }}"
          BASE="${{ env.PAGES_BASE_URL }}/releases/${VER}"
          
          cat > files/etc/apk/repositories.d/custom.list <<EOF
          ${BASE}/targets/${{ env.TARGET_SUBTARGET }}/packages
          ${BASE}/packages/${{ env.TARGET_ARCH }}/base
          ${BASE}/packages/${{ env.TARGET_ARCH }}/luci
          ${BASE}/packages/${{ env.TARGET_ARCH }}/packages
          ${BASE}/packages/${{ env.TARGET_ARCH }}/routing
          ${BASE}/packages/${{ env.TARGET_ARCH }}/telephony
          EOF
          
          echo "✅ Keys generated and injected into files/"
          ls -la files/etc/apk/keys/
          echo "✅ Custom repositories injected:"
          cat files/etc/apk/repositories.d/custom.list

      - name: Download Packages
        run: |
          cd openwrt
          make download -j8

      - name: Build Firmware
        id: compile
        run: |
          cd openwrt
          # 此时 make 会使用我们预生成的 key-build.pem 进行签名，并将 files/ 打包进 rootfs
          make -j$(nproc) V=s || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Organize Pages & Upload Keys
        if: steps.compile.outputs.status == 'success'
        run: |
          PAGES_ROOT="$GITHUB_WORKSPACE/pages_root"
          VER="${{ inputs.openwrt_version }}"
          REPO_BASE="$PAGES_ROOT/releases/${VER}"
          
          mkdir -p "$REPO_BASE"
          mkdir -p "$PAGES_ROOT/keys"

          # 1. 复制软件包
          [ -d "$GITHUB_WORKSPACE/openwrt/bin/packages" ] && cp -r "$GITHUB_WORKSPACE/openwrt/bin/packages" "$REPO_BASE/"
          [ -d "$GITHUB_WORKSPACE/openwrt/bin/targets" ] && cp -r "$GITHUB_WORKSPACE/openwrt/bin/targets" "$REPO_BASE/"

          # 2. 将预生成的公钥发布到 Pages (方便用户手动下载或验证)
          cp "$GITHUB_WORKSPACE/openwrt/key-build.pub" "$PAGES_ROOT/keys/"

          # 3. 清理大文件
          find "$REPO_BASE" \( -name "openwrt-imagebuilder-*" -o -name "openwrt-toolchain-*" -o -name "kernel-debug.tar.zst" -o -name "*-rootfs.tar.zst" \) -exec rm -rf {} + 2>/dev/null || true

          echo "<h1>OpenWrt ${VER} APK Repository</h1>" > "$PAGES_ROOT/index.html"
          touch "$PAGES_ROOT/.nojekyll"

          FIRMWARE_DIR=$(ls -d $GITHUB_WORKSPACE/openwrt/bin/targets/*/* | head -n 1)
          echo "FIRMWARE_DIR=$FIRMWARE_DIR" >> $GITHUB_ENV

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success'
        with:
          name: OpenWrt_${{ inputs.openwrt_version }}_R3S
          path: |
            ${{ env.FIRMWARE_DIR }}/*.img.gz
            ${{ env.FIRMWARE_DIR }}/*.buildinfo
            ${{ env.FIRMWARE_DIR }}/sha256sums

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: steps.compile.outputs.status == 'success'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages_root
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy OpenWrt ${{ inputs.openwrt_version }} APK Repo"
