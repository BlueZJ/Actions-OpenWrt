name: Build OpenWrt 25.12.2 for NanoPi R3S (With Packages)

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/openwrt/openwrt.git
  REPO_BRANCH: v25.12.2
  CONFIG_FILE: 'r3s.config'
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift
          sudo apt-get -y purge azure-cli google-cloud-sdk mono-devel powershell python3-pyelftools python3-jinja2
          sudo apt-get autoremove --purge -y
          df -h

      - name: Install Build Dependencies
        timeout-minutes: 10
        run: |
          sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/sources.list
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-pyelftools python3-setuptools rsync swig unzip zlib1g-dev \
            file wget

      - name: Clone OpenWrt Source
        run: |
          git clone $REPO_URL --branch $REPO_BRANCH --depth 1 openwrt

      - name: Update & Install Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load Custom .config
        run: |
          [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
          cd openwrt
          make defconfig

      - name: Download Packages
        run: |
          cd openwrt
          make download -j8

      - name: Build Firmware
        id: compile
        run: |
          cd openwrt
          make -j$(nproc) V=s || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Organize Files
        if: steps.compile.outputs.status == 'success'
        run: |
          cd openwrt/bin/targets/*/*

          # 1. 记录固件路径
          echo "FIRMWARE_DIR=$PWD" >> $GITHUB_ENV

          # 2. 收集所有 APK 包，保留原始目录结构
          mkdir -p $GITHUB_WORKSPACE/all_apks

          # 切换到 bin 目录，以便 cp --parents 以 packages/ 和 targets/ 为相对根路径
          cd $GITHUB_WORKSPACE/openwrt/bin

          # 通用软件包（luci、base、packages 等 feeds）
          find packages/ -type f -name "*.apk" \
            -exec cp --parents -t $GITHUB_WORKSPACE/all_apks/ {} +

          # 内核模块包（kmods）
          find targets/ -type f -name "*.apk" \
            -exec cp --parents -t $GITHUB_WORKSPACE/all_apks/ {} +

          # 3. 回到固件目录，删除不需要的大型包
          cd $GITHUB_WORKSPACE/openwrt/bin/targets/*/*
          rm -rf openwrt-imagebuilder-*
          rm -rf openwrt-toolchain-*
          rm -rf kernel-debug.tar.zst
          rm -rf packages

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success'
        with:
          name: OpenWrt_R3S_Pure_Firmware
          path: |
            ${{ env.FIRMWARE_DIR }}/*.img.gz
            ${{ env.FIRMWARE_DIR }}/*.buildinfo
            ${{ env.FIRMWARE_DIR }}/sha256sums

      - name: Upload All APK Packages
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success'
        with:
          name: OpenWrt_R3S_All_APK_Packages
          path: ${{ github.workspace }}/all_apks/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: steps.compile.outputs.status == 'success'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ github.workspace }}/structured_apks
          publish_branch: gh-pages  # 将包发布到这个分支
          force_orphan: true         # 每次编译只保留最新的包，防止仓库体积无限膨胀

      

