name: Build OpenWrt 25.12.2 for NanoPi R3S (With Packages)

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/openwrt/openwrt.git
  REPO_BRANCH: v25.12.2
  CONFIG_FILE: 'r3s.config'
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift
          sudo apt-get -y purge azure-cli google-cloud-sdk mono-devel powershell python3-pyelftools python3-jinja2
          sudo apt-get autoremove --purge -y
          df -h

      - name: Install Build Dependencies
        timeout-minutes: 10
        run: |
          sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/sources.list
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-pyelftools python3-setuptools rsync swig unzip zlib1g-dev \
            file wget

      - name: Clone OpenWrt Source
        run: |
          git clone $REPO_URL --branch $REPO_BRANCH --depth 1 openwrt

      - name: Update & Install Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load Custom .config
        run: |
          [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
          cd openwrt
          make defconfig

      - name: Download Packages
        run: |
          cd openwrt
          make download -j8

      - name: Build Firmware
        id: compile
        run: |
          cd openwrt
          make -j$(nproc) V=s || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Organize Files
        if: steps.compile.outputs.status == 'success'
        run: |
          # 1. 整理固件 (镜像文件)
          mkdir -p publish_firmware
          cp openwrt/bin/targets/*/*/*img.gz publish_firmware/ 2>/dev/null || true
          cp openwrt/bin/targets/*/*/*.manifest publish_firmware/ 2>/dev/null || true
          
          # 2. 整理软件包 (所有编译出来的 .apk 或 .ipk)
          # 我们把整个 bin/packages 目录打包，这样它包含了索引文件，以后可以做私有仓库
          tar -zcvf openwrt_packages.tar.gz -C openwrt/bin/ packages/
          
          echo "FIRMWARE_DIR=$PWD/publish_firmware" >> $GITHUB_ENV
          echo "PACKAGES_ARCHIVE=$PWD/openwrt_packages.tar.gz" >> $GITHUB_ENV

      - name: Upload Firmware Image
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success'
        with:
          name: OpenWrt_R3S_Images
          path: ${{ env.FIRMWARE_DIR }}/*

      - name: Upload All Packages
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success'
        with:
          name: OpenWrt_R3S_All_Packages
          path: ${{ env.PACKAGES_ARCHIVE }}
