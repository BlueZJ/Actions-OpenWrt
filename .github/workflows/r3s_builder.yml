name: Build OpenWrt 25.12.2 for NanoPi R3S (With Packages)

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/openwrt/openwrt.git
  REPO_BRANCH: v25.12.2
  CONFIG_FILE: 'r3s.config'
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift
          sudo apt-get -y purge azure-cli google-cloud-sdk mono-devel powershell python3-pyelftools python3-jinja2
          sudo apt-get autoremove --purge -y
          df -h

      - name: Install Build Dependencies
        timeout-minutes: 10
        run: |
          sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/sources.list
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-pyelftools python3-setuptools rsync swig unzip zlib1g-dev \
            file wget

      - name: Clone OpenWrt Source
        run: |
          git clone $REPO_URL --branch $REPO_BRANCH --depth 1 openwrt

      - name: Update & Install Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load Custom .config
        run: |
          [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
          cd openwrt
          make defconfig

      - name: Download Packages
        run: |
          cd openwrt
          make download -j8

      - name: Build Firmware
        id: compile
        run: |
          cd openwrt
          make -j$(nproc) V=s || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Organize Files
        run: |
          # 进入固件目录
          cd openwrt/bin/targets/*/*
          # 记录当前路径（固件和 kmods 所在地）
          echo "FIRMWARE_DIR=$PWD" >> $GITHUB_ENV
          # 删除固件目录下的 packages 副本，节省上传时间和空间
          rm -rf packages

      - name: Upload Firmware and Kmods
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_R3S_Firmware
          # 这里包含：固件镜像 + kmods 文件夹
          path: ${{ env.FIRMWARE_DIR }}/*

      - name: Upload All App Packages
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_R3S_All_Apps
          # 这里包含：bin/packages 目录下所有的插件包
          path: openwrt/bin/packages/
