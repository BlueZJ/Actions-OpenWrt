name: 24.10.7 for NanoPi R3S (With Packages opt publish)

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/openwrt/openwrt.git
  REPO_BRANCH: v24.10.7
  CONFIG_FILE: 'r3s.config'
  TZ: Asia/Shanghai

permissions:
  contents: write   # 关键：允许写入 gh-pages 分支

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift
          sudo apt-get -y purge azure-cli google-cloud-sdk mono-devel powershell python3-pyelftools python3-jinja2
          sudo apt-get autoremove --purge -y
          df -h

      - name: Install Build Dependencies
        timeout-minutes: 10
        run: |
          sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/sources.list
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-pyelftools python3-setuptools rsync swig unzip zlib1g-dev \
            file wget

      - name: Clone OpenWrt Source
        run: |
          git clone $REPO_URL --branch $REPO_BRANCH --depth 1 openwrt

      - name: Update & Install Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load Custom .config
        run: |
          [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
          cd openwrt
          make defconfig

      - name: Download Packages
        run: |
          cd openwrt
          make download -j8

      - name: Build Firmware
        id: compile
        run: |
          cd openwrt
          make -j$(nproc) V=s || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Organize Repository for Pages
        if: steps.compile.outputs.status == 'success'
        run: |
          # 构建一个完全模拟 downloads.openwrt.org 结构的目录
          # 这样你只需把客户端的 base URL 替换成 GitHub Pages 即可
          PAGES_ROOT="$GITHUB_WORKSPACE/pages_root"
          REPO_BASE="$PAGES_ROOT/releases/25.12.2"
          mkdir -p "$REPO_BASE"

          # 1. 复制通用 feeds（base / luci / packages / routing / telephony）
          if [ -d "$GITHUB_WORKSPACE/openwrt/bin/packages" ]; then
            cp -r "$GITHUB_WORKSPACE/openwrt/bin/packages" "$REPO_BASE/"
          fi

          # 2. 复制 targets（包含 kmods 内核模块包和 packages.adb 索引）
          if [ -d "$GITHUB_WORKSPACE/openwrt/bin/targets" ]; then
            cp -r "$GITHUB_WORKSPACE/openwrt/bin/targets" "$REPO_BASE/"
          fi

          # 关键新增：复制 APK 签名公钥到 Pages 根目录
          mkdir -p "$PAGES_ROOT/keys"
          if [ -f "$GITHUB_WORKSPACE/openwrt/key-build.pub" ]; then
            cp "$GITHUB_WORKSPACE/openwrt/key-build.pub" "$PAGES_ROOT/keys/"
          fi
          # OpenWrt 25.x APK 使用的公钥可能是这个名字
          if [ -f "$GITHUB_WORKSPACE/openwrt/public-key.pem" ]; then
            cp "$GITHUB_WORKSPACE/openwrt/public-key.pem" "$PAGES_ROOT/keys/"
          fi
          # 从 staging_dir 中查找 apk 公钥（最可靠的位置）
          find "$GITHUB_WORKSPACE/openwrt/staging_dir" -name "*.pem" -path "*/etc/apk/keys/*" -exec cp {} "$PAGES_ROOT/keys/" \; 2>/dev/null || true
          # 从已编译的 rootfs 中提取（最终位置）
          find "$GITHUB_WORKSPACE/openwrt/build_dir" -path "*/root-*/etc/apk/keys/*" -type f -exec cp {} "$PAGES_ROOT/keys/" \; 2>/dev/null || true
      
          echo "===== Public keys collected ====="
          ls -la "$PAGES_ROOT/keys/" || echo "No keys found"

          echo "===== Verify signed index ====="
          find "$REPO_BASE" -name "packages.adb" -exec sh -c 'echo "{}:"; head -c 64 "{}" | xxd | head -2' \;


          # 3. 清理无用的大文件，避免 Pages 超出 1GB 限制
          find "$REPO_BASE" -name "openwrt-imagebuilder-*" -exec rm -rf {} + 2>/dev/null || true
          find "$REPO_BASE" -name "openwrt-toolchain-*" -exec rm -rf {} + 2>/dev/null || true
          find "$REPO_BASE" -name "kernel-debug.tar.zst" -delete 2>/dev/null || true
          find "$REPO_BASE" -name "*-rootfs.tar.zst" -delete 2>/dev/null || true

          # 4. 创建一个简单的 index.html 方便浏览
          echo '<h1>OpenWrt 25.12.2 Custom Repository for NanoPi R3S</h1>' > "$PAGES_ROOT/index.html"
          echo '<p>Repository base: <code>releases/25.12.2/</code></p>' >> "$PAGES_ROOT/index.html"

          # 5. 添加 .nojekyll，防止 GitHub Pages 把下划线开头的目录隐藏
          touch "$PAGES_ROOT/.nojekyll"

          # 6. 记录固件路径供下一步上传
          FIRMWARE_DIR=$(ls -d $GITHUB_WORKSPACE/openwrt/bin/targets/*/* | head -n 1)
          echo "FIRMWARE_DIR=$FIRMWARE_DIR" >> $GITHUB_ENV

          # 调试输出
          echo "===== Pages Root Tree ====="
          find "$PAGES_ROOT" -maxdepth 5 -type d
          echo "===== packages.adb files ====="
          find "$PAGES_ROOT" -name "packages.adb"
          du -sh "$PAGES_ROOT"

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success'
        with:
          name: OpenWrt_R3S_Pure_Firmware
          path: |
            ${{ env.FIRMWARE_DIR }}/*.img.gz
            ${{ env.FIRMWARE_DIR }}/*.buildinfo
            ${{ env.FIRMWARE_DIR }}/sha256sums

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: steps.compile.outputs.status == 'success'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages_root
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy OpenWrt 25.12.2 R3S packages"
