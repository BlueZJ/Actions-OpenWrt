name: Build OpenWrt 25.12.6 R3S eBTF

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt Version (e.g. 25.12.6)'
        default: '25.12.6'
        required: true
      repo_branch:
        description: 'Git Branch or Tag (e.g. v25.12.6, openwrt-25.12)'
        default: 'v25.12.6'
        required: true

permissions:
  contents: write

concurrency:
  group: openwrt-r3s-${{ github.ref }}
  cancel-in-progress: false

env:
  REPO_URL: https://github.com/openwrt/openwrt.git
  CONFIG_FILE: 'offfical_r3s.config'
  TZ: Asia/Shanghai
  # ⚠️ 改成你自己的 <用户名>.github.io/<仓库名>
  PAGES_BASE_URL: 'https://BlueZJ.github.io/Actions-OpenWrt'
  # ⚠️ 不要命名为 TARGET_ARCH：它是 GNU make 内建变量(COMPILE.c 里含 $(TARGET_ARCH))，
  #    会导致 `cc aarch64 -c conf.c` 这类错误。PKG_ARCH 必须是 CONFIG_TARGET_ARCH_PACKAGES 的值。
  PKG_ARCH: 'aarch64_generic'
  PKG_SUBTARGET: 'rockchip/armv8'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350          # 免费 runner 单 job 上限 6h
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Free Disk Space
        run: |
          # 只删目录，绝不 apt purge / autoremove（会破坏预装工具链）
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules
          docker rmi $(docker image ls -q) 2>/dev/null || true
          df -h

      - name: Install Build Dependencies
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang llvm flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev libelf-dev liblzma-dev libbsd-dev \
            pkg-config python3-dev python3-setuptools python3-pyelftools \
            rsync swig unzip zlib1g-dev file wget dwarves qemu-utils openssl \
            bc time xxd zstd xz-utils bzip2 patch curl device-tree-compiler
          # scripts/config 用 make 默认 CC=cc，而 prereq 只检查 gcc，这里兜底
          command -v cc >/dev/null || sudo update-alternatives --install /usr/bin/cc cc /usr/bin/gcc 100
          cc --version && gcc --version && clang --version | head -1

      - name: Clone OpenWrt Source
        run: |
          git clone "$REPO_URL" --branch "${{ inputs.repo_branch }}" --depth 1 openwrt
          cd openwrt && git log -1 --oneline

      - name: Update & Install Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load Config (trim buildbot options, keep ALL_KMODS)
        run: |
          cd openwrt
          [ -e "$GITHUB_WORKSPACE/$CONFIG_FILE" ] || { echo "Error: $CONFIG_FILE not found in repo root"; exit 1; }
          cp "$GITHUB_WORKSPACE/$CONFIG_FILE" .config

          set_conf() {  # $1=符号(不带 CONFIG_)  $2=y|n|带引号的字符串
            sed -i "/^CONFIG_$1=/d; /^# CONFIG_$1 is not set/d" .config
            if [ "$2" = "n" ]; then printf '# CONFIG_%s is not set\n' "$1" >> .config
            else printf 'CONFIG_%s=%s\n' "$1" "$2" >> .config; fi
          }

          VER="${{ inputs.openwrt_version }}"

          # —— 版本与官方源地址保持一致 ——
          set_conf VERSION_NUMBER "\"$VER\""
          set_conf VERSION_REPO "\"https://downloads.openwrt.org/releases/$VER\""

          [ -e "$GITHUB_WORKSPACE/my.config" ] || { echo "Error: my.config not found in repo root"; exit 1; }
          cat "$GITHUB_WORKSPACE/my.config" >> .config

          make defconfig

          # 兜底：若被 ALL_KMODS 降回 m，再钉一次
          for p in PACKAGE_kmod-r8169 PACKAGE_r8169-firmware; do
            grep -q "^CONFIG_$p=y$" .config && continue
            echo "⚠️ $p 被降回 m，重新钉死"
            sed -i "/^CONFIG_$p=/d; /^# CONFIG_$p is not set/d" .config
            printf 'CONFIG_%s=y\n' "$p" >> .config
            make defconfig
          done

          echo "===== 关键开关复核 ====="
          grep -E '^(CONFIG_PACKAGE_kmod-r8169|CONFIG_PACKAGE_r8169-firmware|CONFIG_PACKAGE_tc-bpf|CONFIG_PACKAGE_bpftool-full|CONFIG_KERNEL_DEBUG_INFO_BTF|CONFIG_KERNEL_MODULE_ALLOW_BTF_MISMATCH)=' .config

          grep -q '^CONFIG_PACKAGE_kmod-r8169=y'    .config || { echo "::error::kmod-r8169 不是 =y"; exit 1; }
          grep -q '^CONFIG_PACKAGE_r8169-firmware=y' .config || { echo "::error::r8169-firmware 不是 =y"; exit 1; }

          if grep -qE '^CONFIG_PACKAGE_(ppp|ppp-mod-pppoe|luci-app-sqm|luci-app-upnp)=y' .config; then
            echo "::error::PPPoE / SQM / UPnP 仍被启用"; exit 1
          fi
          echo "✅ 校验通过"

      - name: Prepare APK Keys & Rootfs Overlay
        env:
          APK_PRIVATE_KEY: ${{ secrets.APK_PRIVATE_KEY }}
        run: |
          cd openwrt
          # 25.12 的密钥文件名固定为 private-key.pem / public-key.pem（rules.mk），
          # 且必须是 EC prime256v1（package/Makefile），不是 RSA、不是 key-build.*
          if [ -n "$APK_PRIVATE_KEY" ]; then
            echo '🔑 使用 Secret 中的固定私钥（跨次构建复用同一把钥匙）'
            printf '%s\n' "$APK_PRIVATE_KEY" > private-key.pem
          else
            echo '🔑 未配置 APK_PRIVATE_KEY，本次构建临时生成 EC 密钥'
            openssl ecparam -name prime256v1 -genkey -noout -out private-key.pem
          fi
          chmod 600 private-key.pem
          openssl ec -in private-key.pem -pubout -out public-key.pem

          # 公钥注入（BUILDBOT=n 时 base-files 也会自动装，同名同内容，双保险）
          mkdir -p files/etc/apk/keys
          cp public-key.pem files/etc/apk/keys/public-key.pem

          mkdir -p files/etc/apk/repositories.d
          # 覆盖官方源，避免设备仍去 downloads.openwrt.org 拉索引（签名/ABI 都不匹配）
          : > files/etc/apk/repositories.d/distfeeds.list
          BASE="${PAGES_BASE_URL}/releases/${{ inputs.openwrt_version }}"
          cat > files/etc/apk/repositories.d/custom.list <<EOF
          ${BASE}/targets/${PKG_SUBTARGET}/packages/packages.adb
          ${BASE}/packages/${PKG_ARCH}/base/packages.adb
          ${BASE}/packages/${PKG_ARCH}/luci/packages.adb
          ${BASE}/packages/${PKG_ARCH}/packages/packages.adb
          ${BASE}/packages/${PKG_ARCH}/routing/packages.adb
          ${BASE}/packages/${PKG_ARCH}/telephony/packages.adb
          EOF
          echo '===== 注入的软件源 ====='; cat files/etc/apk/repositories.d/custom.list

      - name: Download Packages
        run: |
          cd openwrt
          make download -j8 || make download -j1 V=s
          df -h

      - name: Build Firmware
        id: compile
        run: |
          cd openwrt
          # IGNORE_ERRORS=1：个别冷门 kmod 编译失败不中断整体（ALL_KMODS 必备）
          make -j"$(nproc)" IGNORE_ERRORS=1 || make -j1 V=s IGNORE_ERRORS=1
          FW_DIR="$(ls -d "$PWD"/bin/targets/*/* | head -n1)"
          echo "firmware_dir=$FW_DIR" >> "$GITHUB_OUTPUT"
          echo "status=success" >> "$GITHUB_OUTPUT"
          df -h

      - name: Generate Package Index (packages.adb)
        if: steps.compile.outputs.status == 'success'
        run: |
          cd openwrt
          # 默认 world 不生成发布用的每目录索引，必须显式跑 package/index
          make package/index
          echo '===== 索引检查 ====='
          find bin/packages bin/targets -name packages.adb -printf '%p  %s bytes\n' | sort

      - name: Organize Pages
        if: steps.compile.outputs.status == 'success'
        run: |
          VER="${{ inputs.openwrt_version }}"
          PAGES_ROOT="$GITHUB_WORKSPACE/pages_root"
          REPO_BASE="$PAGES_ROOT/releases/$VER"
          mkdir -p "$REPO_BASE" "$PAGES_ROOT/keys"
          cp -r openwrt/bin/packages "$REPO_BASE/"
          cp -r openwrt/bin/targets  "$REPO_BASE/"
          cp openwrt/public-key.pem  "$PAGES_ROOT/keys/public-key.pem"

          # 清理大文件（Pages 站点建议 < 1GB）
          find "$REPO_BASE" \( -name 'openwrt-imagebuilder-*' -o -name 'openwrt-toolchain-*' \
               -o -name 'openwrt-sdk-*' -o -name 'kernel-debug*' -o -name '*-rootfs.tar.*' \
               -o -name '*.bom.cdx.json' \) -exec rm -rf {} + 2>/dev/null || true

          {
            echo "<h1>OpenWrt ${VER} · NanoPi R3S · APK Repository</h1>"
            echo "<p>Public key: <a href='./keys/public-key.pem'>public-key.pem</a></p>"
            echo "<p>Repo list: <code>/etc/apk/repositories.d/custom.list</code></p>"
            echo "<pre>$(cd "$PAGES_ROOT" && find releases -maxdepth 4 -type d | sort)</pre>"
          } > "$PAGES_ROOT/index.html"
          touch "$PAGES_ROOT/.nojekyll"
          du -sh "$PAGES_ROOT"

      - name: Upload Firmware & Build Metadata
        uses: actions/upload-artifact@v7
        if: steps.compile.outputs.status == 'success'
        with:
          name: OpenWrt_${{ inputs.openwrt_version }}_R3S
          if-no-files-found: error
          path: |
            ${{ steps.compile.outputs.firmware_dir }}/*.img.gz
            ${{ steps.compile.outputs.firmware_dir }}/*.manifest
            ${{ steps.compile.outputs.firmware_dir }}/*.buildinfo
            ${{ steps.compile.outputs.firmware_dir }}/sha256sums
            openwrt/.config
            openwrt/public-key.pem

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: steps.compile.outputs.status == 'success'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages_root
          publish_branch: gh-pages
          force_orphan: true      # 单提交，仓库不膨胀
          keep_files: true        # 但保留已有版本目录，历史版本不被清空
          commit_message: "Deploy OpenWrt ${{ inputs.openwrt_version }} APK Repo"
