name: Build OpenWrt 25.12.2 for NanoPi R3S (LLVM/Clang)

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/openwrt/openwrt.git
  REPO_BRANCH: v25.12.2
  CONFIG_FILE: 'r3s_llvm.config'
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/powershell /usr/share/swift \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo apt-get -y purge azure-cli google-cloud-sdk mono-devel \
                                powershell firefox snapd
          sudo apt-get autoremove --purge -y
          sudo apt-get clean
          df -h

      - name: Install Build Dependencies (incl. LLVM/Clang)
        timeout-minutes: 15
        run: |
          sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/sources.list
          sudo apt-get update
          sudo apt-get install -y \
            build-essential flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-pyelftools \
            python3-setuptools rsync swig unzip zlib1g-dev file wget \
            clang lld llvm llvm-dev libclang-dev libzstd-dev \
            ccache ninja-build cmake
          # 设置 clang 为默认编译器(host 端)
          sudo update-alternatives --install /usr/bin/cc  cc  /usr/bin/clang   100
          sudo update-alternatives --install /usr/bin/c++ c++ /usr/bin/clang++ 100
          clang --version
          ld.lld --version

      - name: Clone OpenWrt Source
        run: |
          git clone $REPO_URL --branch $REPO_BRANCH --depth 1 openwrt

      - name: Update & Install Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load Custom .config
        run: |
          [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
          cd openwrt
          # 防御性追加:确保 LLVM 选项写入
          {
            echo "CONFIG_USE_LLVM_HOST=y"
            echo "CONFIG_USE_LLVM_BUILD=y"
            echo "CONFIG_KERNEL_CC_OPTIMIZE_FOR_PERFORMANCE=y"
            echo "CONFIG_LTO_CLANG_FULL=y"
            echo "CONFIG_KERNEL_LD_DEAD_CODE_DATA_ELIMINATION=y"
          } >> .config
          make defconfig

      - name: Pre-build LLVM Toolchain (required by OpenWrt)
        run: |
          cd openwrt
          make tools/llvm-bpf/compile -j$(nproc) V=s || make tools/llvm-bpf/compile -j1 V=s
          make toolchain/install -j$(nproc) V=s || make toolchain/install -j1 V=s

      - name: Download Packages
        run: |
          cd openwrt
          make download -j8

      - name: Build Firmware (Clang)
        id: compile
        run: |
          cd openwrt
          export CC=clang
          export HOSTCC=clang
          export HOSTCXX=clang++
          make -j$(nproc) V=s || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Organize Files
        if: steps.compile.outputs.status == 'success'
        run: |
          cd openwrt/bin/targets/*/*
          echo "FIRMWARE_DIR=$PWD" >> $GITHUB_ENV
          rm -rf openwrt-imagebuilder-* openwrt-toolchain-* kernel-debug.tar.zst packages

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success'
        with:
          name: OpenWrt_R3S_LLVM_Firmware
          path: |
            ${{ env.FIRMWARE_DIR }}/*.img.gz
            ${{ env.FIRMWARE_DIR }}/*.buildinfo
            ${{ env.FIRMWARE_DIR }}/sha256sums
