name: Build OpenWrt 25.12.2 with LLVM

on:
  workflow_dispatch: # 手动触发

env:
  REPO_URL: https://github.com/openwrt/openwrt.git
  REPO_BRANCH: v25.12.2
  CONFIG_FILE: '.config' # 确保你的配置文件在仓库根目录
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04 # 建议指定版本，24.04 对 LLVM 18 支持更好

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 关键步骤：清理磁盘空间，否则必挂
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift
          sudo apt-get -y purge azure-cli google-cloud-sdk mono-devel powershell
          sudo apt-get autoremove --purge -y
          df -h

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18"

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Clone OpenWrt Source
        run: |
          git clone $REPO_URL --branch $REPO_BRANCH --depth 1 openwrt

      - name: Update & Install Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load Custom .config
        run: |
          # 将你仓库里的 .config 移动到源码目录
          [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
          cd openwrt
          # 补充可能缺失的依赖配置，并强制开启 LLVM 支持
          echo "CONFIG_USE_LLVM=y" >> .config
          echo "CONFIG_USE_LLVM_HOST=y" >> .config
          echo "CONFIG_USE_LLVM_TARGET=y" >> .config
          make defconfig

      - name: Download Packages
        run: |
          cd openwrt
          make download -j8

      - name: Build Firmware
        id: compile
        run: |
          cd openwrt
          # 使用 nproc 获取核心数，并在编译时显式声明编译器
          make -j$(nproc) \
            CC=clang \
            CXX=clang++ \
            AR=llvm-ar \
            NM=llvm-nm \
            STRIP=llvm-strip \
            V=s || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Organize Files
        if: steps.compile.outputs.status == 'success'
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        if: env.FIRMWARE_PATH != ''
        with:
          name: OpenWrt_25.12.2_LLVM
          path: ${{ env.FIRMWARE_PATH }}/*
